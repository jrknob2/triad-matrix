<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        background: #fff7ed;
        color: #111;
        font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 16px;
      }
    </style>
  </head>
  <body>
    <strong>Sheet notation minimal WebView probe</strong>
    <script>
      function postProbe(stage, details = {}) {
        try {
          globalThis.SheetLog?.postMessage(
            JSON.stringify({ level: 'probe', message: JSON.stringify({ stage, ...details }) }),
          );
        } catch (_) {}
      }

      globalThis.addEventListener('error', (event) => {
        postProbe('probe-minimal-error', {
          message: event.error?.message ?? event.message ?? 'unknown',
          stack: event.error?.stack ?? '',
        });
      });

      postProbe('probe-minimal-ready', {
        href: globalThis.location?.href ?? 'unknown',
        userAgent: globalThis.navigator?.userAgent ?? 'unknown',
      });
    </script>
  </body>
</html>
