<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        background: #fff7ed;
        color: #111;
        font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 16px;
      }

      #notation {
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <strong>Sheet notation renderer WebView probe</strong>
    <div id="notation"></div>
    <script>
      function postProbe(stage, details = {}) {
        try {
          globalThis.SheetLog?.postMessage(
            JSON.stringify({ level: 'probe', message: JSON.stringify({ stage, ...details }) }),
          );
        } catch (_) {}
      }

      globalThis.addEventListener('error', (event) => {
        postProbe('probe-renderer-error', {
          message: event.error?.message ?? event.message ?? 'unknown',
          stack: event.error?.stack ?? '',
        });
      });

      globalThis.addEventListener('unhandledrejection', (event) => {
        postProbe('probe-renderer-unhandled-rejection', {
          message: event.reason?.message ?? String(event.reason),
          stack: event.reason?.stack ?? '',
        });
      });

      postProbe('probe-renderer-before-vexflow', {
        href: globalThis.location?.href ?? 'unknown',
      });
    </script>
    <script src="./vendor/vexflow.js"></script>
    <script>
      globalThis.VexFlow = globalThis.VexFlow || globalThis.Vex?.Flow || globalThis.Vex;
      postProbe('probe-renderer-after-vexflow', {
        hasVexFlow: globalThis.VexFlow != null,
      });
    </script>
    <script src="./app_renderer.js"></script>
    <script>
      const documentJson = {
        subdivision: '8',
        feel: 'straight',
        timeSignature: '4/4',
        measures: [
          {
            notes: [
              { voices: ['snare'], sticking: 'R' },
              { voices: ['kick'], sticking: 'K' },
            ],
          },
        ],
      };
      const hasRenderer = typeof globalThis.renderDrumNotationSvgWithMetadata === 'function';
      postProbe('probe-renderer-ready', {
        hasRenderer,
        hasVexFlow: globalThis.VexFlow != null,
      });
      if (hasRenderer) {
        const result = globalThis.renderDrumNotationSvgWithMetadata(documentJson, {
          availableWidth: 480,
          preserveMeasures: true,
          compactLayout: true,
          notesPerSystem: 'auto',
        });
        document.getElementById('notation').innerHTML = result.svg;
        postProbe('probe-renderer-render-complete', {
          svgLength: typeof result.svg === 'string' ? result.svg.length : 0,
          metadataNoteCount: Array.isArray(result.notes) ? result.notes.length : 0,
        });
      }
    </script>
  </body>
</html>
