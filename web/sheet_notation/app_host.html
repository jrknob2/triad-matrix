<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        background: transparent;
        margin: 0;
        overflow: hidden;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      #notation {
        background: var(--sheet-background-color, transparent);
        cursor: default;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }

      #notation.dark {
        background: var(--sheet-background-color, #17130f);
      }

      #notation svg {
        cursor: default;
        display: block;
        max-width: 100%;
        -webkit-tap-highlight-color: transparent;
      }

      #notation.dark svg {
        background: var(--sheet-background-color, #17130f);
      }

      #notation.dark svg path,
      #notation.dark svg line,
      #notation.dark svg rect,
      #notation.dark svg text,
      #notation.dark svg polygon,
      #notation.dark svg polyline {
        fill: #fff;
        stroke: #fff;
      }

      #notation * {
        cursor: default !important;
        -webkit-tap-highlight-color: transparent;
      }

      .drum-selection-overlay,
      .drum-playhead-overlay {
        pointer-events: none;
      }

      .drum-selection-rect {
        filter: drop-shadow(0 0 7px rgba(255, 106, 0, 0.22));
        transition: opacity 180ms ease, transform 180ms ease;
      }

      .drum-note-glow {
        filter: blur(4px);
        mix-blend-mode: multiply;
        transition: opacity 180ms ease;
      }

      #notation.dark .drum-note-glow {
        mix-blend-mode: screen;
      }

      .drum-selection-overlay.guided-practice .drum-selection-rect,
      .drum-selection-overlay.guided-practice .drum-note-glow {
        animation: drum-selection-pulse 1050ms ease-in-out infinite;
      }

      @keyframes drum-selection-pulse {
        0% {
          opacity: 0.62;
        }
        50% {
          opacity: 1;
        }
        100% {
          opacity: 0.62;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .drum-selection-rect,
        .drum-note-glow,
        .drum-selection-overlay.guided-practice .drum-selection-rect,
        .drum-selection-overlay.guided-practice .drum-note-glow {
          animation: none;
          transition: none;
        }
      }

      .empty-notation {
        min-height: 96px;
      }

      .error {
        color: #7c1d1d;
        font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="notation"></div>
    <script>
      function postSheetLog(level, message) {
        try {
          globalThis.SheetLog?.postMessage(JSON.stringify({ level, message }));
        } catch (_) {
          // Logging must never break notation rendering.
        }
      }

      globalThis.addEventListener('error', (event) => {
        postSheetLog('error', event.error?.stack ?? event.message ?? 'Unknown sheet notation error');
      });

      globalThis.addEventListener('unhandledrejection', (event) => {
        postSheetLog(
          'error',
          event.reason?.stack ?? event.reason?.message ?? String(event.reason),
        );
      });
    </script>
    <script src="./vendor/vexflow.js"></script>
    <script>
      globalThis.VexFlow = globalThis.VexFlow || globalThis.Vex?.Flow || globalThis.Vex;
    </script>
    <script src="./app_renderer.js"></script>
    <script>
      const notation = document.getElementById('notation');
      let renderedNotes = [];
      let selectionTargetsByIndex = new Map();
      const selectedIndexes = new Set();
      let selectionPurpose = 'editing';
      let selectionSelectable = true;
      let selectionInteractive = true;
      let playheadState = { visible: false };

      globalThis.DrumcabularySheetNotation = {
        render(payload) {
          try {
            const documentJson = payload.document;
            const selected = Array.isArray(payload.selectedIndexes)
              ? payload.selectedIndexes
              : [];
            selectionPurpose = payload.selectionPurpose ?? payload.selection?.purpose ?? 'editing';
            selectionSelectable = payload.options?.selectable !== false;
            selectionInteractive =
              selectionSelectable && selectionPurpose !== 'guidedPractice';
            const isDark = payload.options?.theme === 'dark';
            const backgroundColor =
              payload.options?.backgroundColor ?? (isDark ? '#17130f' : 'transparent');
            notation.classList.toggle('dark', isDark);
            notation.style.setProperty('--sheet-background-color', backgroundColor);
            notation.style.setProperty(
              '--sheet-selection-color',
              payload.options?.selectionColor ?? '#ff6a00',
            );
            notation.style.setProperty(
              '--sheet-selection-fill-color',
              payload.options?.selectionFillColor ?? 'rgba(255, 106, 0, 0.18)',
            );
            notation.style.setProperty(
              '--sheet-selection-border-color',
              payload.options?.selectionBorderColor ?? 'rgba(255, 106, 0, 0.68)',
            );
            notation.style.setProperty(
              '--sheet-selection-glow-color',
              payload.options?.selectionGlowColor ?? 'rgba(255, 106, 0, 0.38)',
            );
            document.body.style.background = backgroundColor;
            if (!hasRenderableNotes(documentJson)) {
              renderedNotes = [];
              selectionTargetsByIndex = new Map();
              selectedIndexes.clear();
              playheadState = { visible: false };
              notation.innerHTML = '<div class="empty-notation"></div>';
              renderSelection();
              renderPlayhead();
              postHeight();
              return;
            }
            if (typeof globalThis.renderDrumNotationSvgWithMetadata !== 'function') {
              throw new Error('Drumcabulary sheet notation renderer did not load.');
            }
            selectedIndexes.clear();
            selected.forEach((index) => selectedIndexes.add(Number(index)));
            const result = globalThis.renderDrumNotationSvgWithMetadata(documentJson, {
              ...(payload.options ?? {}),
              notesPerSystem: 'auto',
            });
            renderedNotes = result.notes;
            notation.innerHTML = result.svg;
            attachNoteSelection();
            renderSelection();
            renderPlayhead();
            postHeight();
          } catch (error) {
            console.error(error);
            postSheetLog('error', error.stack ?? error.message ?? String(error));
            notation.innerHTML = `<pre class="error">${error.stack ?? error.message}</pre>`;
            postHeight();
          }
        },
        setSelection(selected, purpose) {
          selectedIndexes.clear();
          if (Array.isArray(selected)) {
            selected.forEach((index) => selectedIndexes.add(Number(index)));
          }
          selectionPurpose = typeof purpose === 'string' ? purpose : 'editing';
          selectionInteractive =
            selectionSelectable && selectionPurpose !== 'guidedPractice';
          renderSelection();
        },
        setPlayhead(state) {
          playheadState = state && typeof state === 'object'
            ? state
            : { visible: false };
          renderPlayhead();
        },
      };

      function hasRenderableNotes(documentJson) {
        return documentJson?.measures?.some(
          (measure) => Array.isArray(measure?.notes) && measure.notes.length > 0,
        ) === true;
      }

      if (globalThis.__pendingDrumcabularySheetNotationPayload != null) {
        const pendingPayload = globalThis.__pendingDrumcabularySheetNotationPayload;
        globalThis.__pendingDrumcabularySheetNotationPayload = null;
        globalThis.DrumcabularySheetNotation.render(pendingPayload);
      }

      function attachNoteSelection() {
        const svg = notation.querySelector('svg');
        if (!svg) return;
        const attributed = [...svg.querySelectorAll('[data-drum-note-index]')];
        const fallback = [...svg.querySelectorAll('.vf-stavenote')];
        const noteElements = attributed.length > 0 ? attributed : fallback;
        noteElements.forEach((element, index) => {
          if (!element.dataset.drumNoteIndex) {
            element.dataset.drumNoteIndex = String(index);
          }
          const note = renderedNotes[Number(element.dataset.drumNoteIndex)];
          if (note != null) {
            element.dataset.drumMeasureIndex = String(note.measureIndex);
            element.dataset.drumMeasureNoteIndex = String(note.measureNoteIndex);
          }
        });

        const noteTargets = noteElements
          .map((element) => {
            const note = renderedNotes[Number(element.dataset.drumNoteIndex)];
            if (note == null) return null;
            const bounds = svgBoundsFor(element);
            if (bounds == null) return null;
            return {
              element,
              note,
              bounds,
              x: bounds.x + bounds.width / 2,
              y: bounds.y + bounds.height / 2,
            };
          })
          .filter(Boolean);

        selectionTargetsByIndex = new Map(
          noteTargets.map((target) => [Number(target.note.index), target]),
        );

        svg.addEventListener('click', (event) => {
          if (!selectionInteractive) return;
          const element = event.target.closest('[data-drum-note-index], .vf-stavenote');
          if (element == null || !svg.contains(element)) {
            selectedIndexes.clear();
            renderSelection();
            postSelection();
            return;
          }

          event.stopPropagation();
          const noteIndex = Number(element.dataset.drumNoteIndex);
          if (!Number.isInteger(noteIndex)) return;
          if (selectedIndexes.has(noteIndex)) {
            selectedIndexes.delete(noteIndex);
          } else {
            selectedIndexes.add(noteIndex);
          }
          renderSelection();
          postSelection();
        });
      }

      function svgBoundsFor(element) {
        try {
          return element.getBBox();
        } catch (_) {
          return null;
        }
      }

      function renderSelection() {
        notation.querySelector('.drum-selection-overlay')?.remove();
        const svg = notation.querySelector('svg');
        const overlay = svg == null
          ? null
          : document.createElementNS('http://www.w3.org/2000/svg', 'g');
        overlay?.setAttribute(
          'class',
          `drum-selection-overlay ${selectionPurpose === 'guidedPractice' ? 'guided-practice' : 'editing'}`,
        );
        for (const index of selectedIndexes) {
          addEventHighlight(overlay, index, { purpose: selectionPurpose });
        }
        if (overlay != null && overlay.childNodes.length > 0) {
          svg.insertBefore(overlay, svg.firstChild);
        }
      }

      function renderPlayhead() {
        notation.querySelector('.drum-playhead-overlay')?.remove();
        if (playheadState?.visible !== true) return;
        const svg = notation.querySelector('svg');
        if (svg == null) return;
        const target = selectionTargetsByIndex.get(Number(playheadState.tokenIndex));
        if (target == null) return;

        const overlay = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        overlay.setAttribute('class', 'drum-playhead-overlay');
        appendEventHighlightForTarget(overlay, target, { purpose: 'playhead' });
        if (overlay.childNodes.length > 0) {
          svg.insertBefore(overlay, svg.firstChild);
        }
      }

      function clamp(value, min, max) {
        if (!Number.isFinite(value)) return min;
        return Math.min(max, Math.max(min, value));
      }

      function addEventHighlight(overlay, index, options = {}) {
        if (overlay == null) return;
        const target = selectionTargetsByIndex.get(Number(index));
        if (target == null || target.note?.rest) return;
        appendEventHighlightForTarget(overlay, target, options);
      }

      function appendEventHighlightForTarget(overlay, target, options = {}) {
        if (overlay == null || target == null || target.note?.rest) return;
        const svg = notation.querySelector('svg');
        if (svg == null) return;
        const rectBounds = eventHighlightBounds(target, svg);
        if (rectBounds == null) return;
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('class', 'drum-selection-rect');
        rect.setAttribute('x', formatSvgNumber(rectBounds.x));
        rect.setAttribute('y', formatSvgNumber(rectBounds.y));
        rect.setAttribute('width', formatSvgNumber(rectBounds.width));
        rect.setAttribute('height', formatSvgNumber(rectBounds.height));
        rect.setAttribute('rx', '10');
        rect.setAttribute('ry', '10');
        rect.style.fill = 'var(--sheet-selection-fill-color, rgba(255, 106, 0, 0.18))';
        rect.style.stroke = 'var(--sheet-selection-border-color, rgba(255, 106, 0, 0.68))';
        rect.style.strokeWidth = options.purpose === 'playhead' ? '1.25' : '1.5';
        overlay.appendChild(rect);

        for (const anchor of noteGlowAnchorsForTarget(target)) {
          const glow = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          glow.setAttribute('class', 'drum-note-glow');
          glow.setAttribute('cx', formatSvgNumber(anchor.x));
          glow.setAttribute('cy', formatSvgNumber(anchor.y));
          glow.setAttribute('r', formatSvgNumber(anchor.radius));
          glow.style.fill = 'var(--sheet-selection-glow-color, rgba(255, 106, 0, 0.38))';
          glow.style.opacity = options.purpose === 'playhead' ? '0.42' : '0.66';
          overlay.appendChild(glow);
        }
      }

      function eventHighlightBounds(target, svg) {
        const bounds = target.bounds;
        const selection = target.note.selection ?? {};
        const svgBounds = svgDrawingBounds(svg);
        const horizontalPadding = 13;
        const verticalPadding = 8;
        const stemY1 = Number.isFinite(selection.stemY1)
          ? selection.stemY1
          : bounds.y;
        const stemY2 = Number.isFinite(selection.stemY2)
          ? selection.stemY2
          : bounds.y + bounds.height;
        const rawX = Math.min(bounds.x, target.x) - horizontalPadding;
        const rawRight = Math.max(bounds.x + bounds.width, target.x) + horizontalPadding;
        const rawY = Math.min(bounds.y, stemY1) - verticalPadding;
        const rawBottom = Math.max(bounds.y + bounds.height, stemY2) + verticalPadding;
        const x = clamp(rawX, 0, svgBounds.width);
        const y = clamp(rawY, 0, svgBounds.height);
        const right = clamp(rawRight, x + 1, svgBounds.width);
        const bottom = clamp(rawBottom, y + 1, svgBounds.height);
        return {
          x,
          y,
          width: right - x,
          height: bottom - y,
        };
      }

      function noteGlowAnchorsForTarget(target) {
        const anchors = [];
        const glyphs = [
          ...target.element.querySelectorAll('path, text, polygon, polyline, ellipse, circle'),
        ];
        for (const glyph of glyphs) {
          const bounds = svgBoundsFor(glyph);
          if (bounds == null) continue;
          if (bounds.width < 2 || bounds.height < 2) continue;
          if (bounds.width > 34 || bounds.height > 34) continue;
          anchors.push({
            x: bounds.x + bounds.width / 2,
            y: bounds.y + bounds.height / 2,
            radius: clamp(Math.max(bounds.width, bounds.height) * 0.78, 7, 14),
          });
        }
        if (anchors.length > 0) return anchors;
        return [{
          x: target.bounds.x + target.bounds.width / 2,
          y: target.bounds.y + target.bounds.height / 2,
          radius: 10,
        }];
      }

      function svgDrawingBounds(svg) {
        const viewBox = svg.viewBox?.baseVal;
        const width = Number.isFinite(viewBox?.width) && viewBox.width > 0
          ? viewBox.width
          : Number(svg.getAttribute('width')) || 640;
        const height = Number.isFinite(viewBox?.height) && viewBox.height > 0
          ? viewBox.height
          : Number(svg.getAttribute('height')) || 160;
        return { width, height };
      }

      function formatSvgNumber(value) {
        return Number(value).toFixed(2).replace(/\.?0+$/, '');
      }

      function postSelection() {
        globalThis.SheetSelection?.postMessage(
          JSON.stringify([...selectedIndexes].sort((a, b) => a - b)),
        );
      }

      function postHeight() {
        const height = Math.ceil(document.documentElement.scrollHeight);
        globalThis.SheetHeight?.postMessage(String(height));
        return height;
      }

    </script>
  </body>
</html>
