lesson_plan:
  id: flow-foundations
  title: Flow Foundations
  subtitle: Starter path for groove, subdivision, fill placement, and kit flow.
  version: 1

  lessons:
    - id: groove-foundation
      number: 1
      title: Groove Foundation
      objective: Build a simple rock groove using simultaneous hand and kick/snare hits.
      skill_focus: groove
      estimated_minutes: 20
      patterns:
        - id: basic-rock-groove
          title: Basic Rock Groove
          role: groove
          subdivision: 8
          notation: "[RK]R [RL]R [RK]R [RL]R"
      exercises:
        - title: Groove Loop
          instructions: Loop the groove until it feels relaxed and even.
          subdivision: 8
          tempo:
            start: 70
            target: 110
      coaching_notes:
        - R is the time hand.
        - K and L should land cleanly with the hand notes.
      mastery:
        - Play the groove for two minutes without rushing.

    - id: the-money-beat
      number: 2
      title: The Money Beat
      objective: Learn the foundational 4/4 drum beat with steady eighth-note hi-hat, kick on 1 and 3, and snare on 2 and 4.
      skill_focus: groove
      estimated_minutes: 25
      patterns:
        - id: money-beat-hi-hat-pulse
          title: Hi-Hat Eighths
          role: warmup
          subdivision: 8
          time_signature: "4/4"
          repeat_count: 8
          notation: "[HH:R][HH:R] [HH:R][HH:R] [HH:R][HH:R] [HH:R][HH:R]"
        - id: money-beat-one-bar
          title: Money Beat - One Bar
          role: groove
          subdivision: 8
          time_signature: "4/4"
          repeat_count: 4
          notation: "[HH K:R][HH:R] [HH S:R][HH:R] [HH K:R][HH:R] [HH S:R][HH:R]"
        - id: money-beat-four-bars
          title: Money Beat - Four Bars With Crash
          role: groove
          subdivision: 8
          time_signature: "4/4"
          notation: "[HH K:R][HH:R] [HH S:R][HH:R] [HH K:R][HH:R] [HH S:R][HH:R] [HH K:R][HH:R] [HH S:R][HH:R] [HH K:R][HH:R] [HH S:R][HH:R] [HH K:R][HH:R] [HH S:R][HH:R] [HH K:R][HH:R] [HH S:R][HH:R] [XK][HH:R] [HH S:R][HH:R] [HH K:R][HH:R] [HH S:R][HH:R]"
      exercises:
        - title: Count The Hi-Hat
          instructions: Count 1 & 2 & 3 & 4 & while playing steady eighth notes on the hi-hat.
          subdivision: 8
          tempo:
            start: 60
            target: 100
          flow:
            - pattern: money-beat-hi-hat-pulse
              repeat: 8

        - title: Add Kick And Snare
          instructions: Keep the hi-hat even, place the kick on 1 and 3, and place the snare on 2 and 4.
          subdivision: 8
          tempo:
            start: 60
            target: 100
          flow:
            - pattern: money-beat-one-bar
              repeat: 8

        - title: Four-Bar Phrase With Crash
          instructions: Play four measures; on measure 4, use crash plus kick on beat 1 instead of hi-hat plus kick.
          subdivision: 8
          tempo:
            start: 60
            target: 100
          flow:
            - pattern: money-beat-four-bars
              repeat: 4
      coaching_notes:
        - Count out loud until the placement feels automatic.
        - Keep the hi-hat steady before adding volume or speed.
        - Make the snare backbeat clear without pulling the tempo forward.
        - Treat the crash plus kick as the start of the fourth measure, not a fill.
      mastery:
        - Play the one-bar beat at 100 BPM with even hi-hat notes.
        - Play the four-measure phrase with the measure-four crash landing cleanly on beat 1.

    - id: accents-and-ghosts
      number: 3
      title: Accents and Ghosts
      objective: Shape patterns with accented notes and ghost notes.
      skill_focus: dynamics
      estimated_minutes: 25
      patterns:
        - id: accent-ghost-five
          title: Accent Ghost Five
          role: chop
          subdivision: 16
          notation: "^R^L^R(L)(L)"
        - id: accent-ghost-with-kick
          title: Accent Ghost With Kick
          role: fill
          subdivision: 16
          notation: "^R^L^R(L)(L) K"
      exercises:
        - title: Contrast Drill
          instructions: Make the accented RLR strong and the LL ghosted but controlled.
          subdivision: 16
          tempo:
            start: 60
            target: 100
      coaching_notes:
        - Do not let ghost notes disappear completely.
        - Keep the accented notes relaxed.
      mastery:
        - Clear dynamic contrast at 100 BPM.

    - id: simultaneous-hits
      number: 4
      title: Simultaneous Hits
      objective: Use bracketed hits to place multiple voices on the same beat.
      skill_focus: coordination
      estimated_minutes: 20
      patterns:
        - id: crash-kick-resolution
          title: Crash Kick Resolution
          role: fill
          subdivision: 16
          notation: "^R^L^R(L)(L) [XK]"
        - id: hands-together
          title: Hands Together
          role: warmup
          subdivision: 16
          notation: "[RL]R [RL]R"
      exercises:
        - title: Resolution Drill
          instructions: Practice landing the final bracketed hit cleanly as one event.
          subdivision: 16
          tempo:
            start: 60
            target: 100
      coaching_notes:
        - Brackets mean same slot, not sequential notes.
        - The final hit should feel like a confident landing point.
      mastery:
        - Land [XK] cleanly without flam between limbs.

    - id: five-note-groupings
      number: 5
      title: Five-Note Groupings
      objective: Learn to feel 5-note phrases inside a 16th-note grid.
      skill_focus: grouping
      estimated_minutes: 30
      patterns:
        - id: raw-five-flow
          title: Raw Five Flow
          role: chop
          subdivision: 16
          notation: "RLRLL K RLRLL RLRLL X"
        - id: shaped-five-flow
          title: Shaped Five Flow
          role: fill
          subdivision: 16
          notation: "^R^L^R(L)(L) K ^R^L^R(L)(L) ^R^L^R(L)(L) [XK]"
      exercises:
        - title: Raw To Shaped
          instructions: Play the raw pattern first, then the shaped version.
          subdivision: 16
          tempo:
            start: 60
            target: 100
      coaching_notes:
        - The spaces show 5 / 1 / 5 / 5 / 1 phrasing.
        - Do not mistake grouping for tuplets.
      mastery:
        - Play the shaped fill at 100 BPM without losing the grid.

    - id: groove-to-fill-flow
      number: 6
      title: Groove to Fill Flow
      objective: Move from groove to fill and back to groove without losing time.
      skill_focus: flow
      estimated_minutes: 30
      patterns:
        - id: basic-rock-groove
          title: Basic Rock Groove
          role: groove
          subdivision: 8
          notation: "[RK]R [RL]R [RK]R [RL]R"
        - id: shaped-five-flow
          title: Shaped Five Flow
          role: fill
          subdivision: 16
          notation: "^R^L^R(L)(L) K ^R^L^R(L)(L) ^R^L^R(L)(L) [XK]"
      exercises:
        - title: Four Bars And Fill
          instructions: Play four bars of groove, then one fill, then return to groove.
          subdivision: 16
          tempo:
            start: 70
            target: 110
          flow:
            - pattern: basic-rock-groove
              repeat: 4
            - pattern: shaped-five-flow
              repeat: 1
      coaching_notes:
        - Count through the fill.
        - The crash/kick resolution should land on beat 1.
      mastery:
        - Complete the exercise three times in a row without rushing the fill.

    - id: triplet-feel
      number: 7
      title: Triplet Feel
      objective: Build comfort with triplet timing without treating groupings as tuplets.
      skill_focus: triplets
      estimated_minutes: 25
      patterns:
        - id: triplet-hands
          title: Triplet Hands
          role: warmup
          subdivision: triplet
          notation: RLR LRL
        - id: triplet-kick
          title: Triplet With Kick
          role: groove
          subdivision: triplet
          notation: "[RK]RL [RL]RL"
      exercises:
        - title: Triplet Control
          instructions: Keep all notes evenly spaced in triplet feel.
          subdivision: triplet
          tempo:
            start: 60
            target: 100
      coaching_notes:
        - Triplet is timing metadata.
        - Grouping spaces do not create triplet timing.
      mastery:
        - Play triplet patterns evenly at 100 BPM.

    - id: subdivision-transitions
      number: 8
      title: Subdivision Transitions
      objective: Switch between 8ths, triplets, and 16ths without freezing.
      skill_focus: subdivision
      estimated_minutes: 30
      patterns:
        - id: transition-base
          title: Transition Base
          role: warmup
          subdivision: 8
          notation: RL RL
      exercises:
        - title: 8ths to Triplets
          instructions: Play the same hand pattern first as 8ths, then as triplets.
          subdivision_sequence:
            - 8
            - triplet
          tempo:
            start: 60
            target: 100
        - title: Triplets to 16ths
          instructions: Play the same hand pattern first as triplets, then as 16ths.
          subdivision_sequence:
            - triplet
            - 16
          tempo:
            start: 60
            target: 100
      coaching_notes:
        - Hear the new grid before switching.
        - Slow down if you hesitate.
      mastery:
        - Switch subdivisions cleanly at 90 BPM.

    - id: triplet-vocabulary-1
      number: 9
      title: Triplet Vocabulary 1
      objective: Learn five triplet vocabulary fragments, combine them into six-note phrases, and apply them inside a simple groove.
      skill_focus: triplets
      estimated_minutes: 35
      patterns:
        - id: triplet-vocab-a
          title: A - Right Ghost Ghost
          role: vocabulary
          subdivision: triplet
          notation: "R(L)(L)"
        - id: triplet-vocab-b
          title: B - Right Left Kick
          role: vocabulary
          subdivision: triplet
          notation: "RLK"
        - id: triplet-vocab-c
          title: C - Right Kick Left
          role: vocabulary
          subdivision: triplet
          notation: "RKL"
        - id: triplet-vocab-d
          title: D - Kick Right Left
          role: vocabulary
          subdivision: triplet
          notation: "KRL"
        - id: triplet-vocab-f
          title: F - Ghost Ghost Left
          role: vocabulary
          subdivision: triplet
          notation: "(R)(R)L"
        - id: basic-triplet-groove
          title: Basic Triplet Groove
          role: groove
          subdivision: triplet
          notation: "[RK]RL [RL]RL"
        - id: six-ab
          title: Six-Note A + B
          role: fill
          subdivision: triplet
          notation: "R(L)(L) RLK"
        - id: six-ac
          title: Six-Note A + C
          role: fill
          subdivision: triplet
          notation: "R(L)(L) RKL"
        - id: six-ad
          title: Six-Note A + D
          role: fill
          subdivision: triplet
          notation: "R(L)(L) KRL"
        - id: six-bc
          title: Six-Note B + C
          role: fill
          subdivision: triplet
          notation: "RLK RKL"
        - id: six-cd
          title: Six-Note C + D
          role: fill
          subdivision: triplet
          notation: "RKL KRL"
        - id: six-af
          title: Six-Note A + F
          role: fill
          subdivision: triplet
          notation: "R(L)(L) (R)(R)L"
        - id: six-fb
          title: Six-Note F + B
          role: fill
          subdivision: triplet
          notation: "(R)(R)L RLK"
        - id: six-fc
          title: Six-Note F + C
          role: fill
          subdivision: triplet
          notation: "(R)(R)L RKL"
      exercises:
        - title: Practice A
          instructions: Loop A until the ghost notes are even and quiet.
          subdivision: triplet
          tempo:
            start: 60
            target: 100
          flow:
            - pattern: triplet-vocab-a
              repeat: 8

        - title: Practice B
          instructions: Loop B and keep the kick evenly spaced with the hands.
          subdivision: triplet
          tempo:
            start: 60
            target: 100
          flow:
            - pattern: triplet-vocab-b
              repeat: 8

        - title: Practice C
          instructions: Loop C and keep the kick from rushing.
          subdivision: triplet
          tempo:
            start: 60
            target: 100
          flow:
            - pattern: triplet-vocab-c
              repeat: 8

        - title: Practice D
          instructions: Loop D and make the kick feel like part of the phrase, not a pickup.
          subdivision: triplet
          tempo:
            start: 60
            target: 100
          flow:
            - pattern: triplet-vocab-d
              repeat: 8

        - title: Practice F
          instructions: Loop F and keep both ghosted right-hand notes controlled.
          subdivision: triplet
          tempo:
            start: 60
            target: 100
          flow:
            - pattern: triplet-vocab-f
              repeat: 8

        - title: Move A Between Voices
          instructions: Loop A while moving the right hand from snare to rack tom, floor tom, and back to snare; keep the ghost notes quiet.
          subdivision: triplet
          tempo:
            start: 60
            target: 100
          flow:
            - pattern: triplet-vocab-a
              repeat: 8

        - title: Move F Between Voices
          instructions: Loop F while moving the left-hand landing note between snare and toms; keep the ghosted right-hand notes controlled.
          subdivision: triplet
          tempo:
            start: 60
            target: 100
          flow:
            - pattern: triplet-vocab-f
              repeat: 8

        - title: Combine A + B
          instructions: Play the six-note phrase A plus B as one continuous phrase.
          subdivision: triplet
          tempo:
            start: 60
            target: 100
          flow:
            - pattern: six-ab
              repeat: 8

        - title: Combine A + C
          instructions: Play the six-note phrase A plus C as one continuous phrase.
          subdivision: triplet
          tempo:
            start: 60
            target: 100
          flow:
            - pattern: six-ac
              repeat: 8

        - title: Combine A + D
          instructions: Play the six-note phrase A plus D as one continuous phrase.
          subdivision: triplet
          tempo:
            start: 60
            target: 100
          flow:
            - pattern: six-ad
              repeat: 8

        - title: Combine B + C
          instructions: Play the six-note phrase B plus C as one continuous phrase.
          subdivision: triplet
          tempo:
            start: 60
            target: 100
          flow:
            - pattern: six-bc
              repeat: 8

        - title: Combine C + D
          instructions: Play the six-note phrase C plus D as one continuous phrase.
          subdivision: triplet
          tempo:
            start: 60
            target: 100
          flow:
            - pattern: six-cd
              repeat: 8

        - title: Combine A + F
          instructions: Play the six-note phrase A plus F with controlled ghost notes.
          subdivision: triplet
          tempo:
            start: 60
            target: 100
          flow:
            - pattern: six-af
              repeat: 8

        - title: Combine F + B
          instructions: Play the six-note phrase F plus B without letting the ghost notes drag.
          subdivision: triplet
          tempo:
            start: 60
            target: 100
          flow:
            - pattern: six-fb
              repeat: 8

        - title: Combine F + C
          instructions: Play the six-note phrase F plus C and keep the kick placement relaxed.
          subdivision: triplet
          tempo:
            start: 60
            target: 100
          flow:
            - pattern: six-fc
              repeat: 8

        - title: Voice A + D Around The Kit
          instructions: Play A+D as one phrase while moving the hand notes around the toms without changing the triplet spacing.
          subdivision: triplet
          tempo:
            start: 60
            target: 100
          flow:
            - pattern: six-ad
              repeat: 8

        - title: Groove With A + B
          instructions: Play four repeats of the groove, then one A+B six-note phrase, then return to the groove.
          subdivision: triplet
          tempo:
            start: 60
            target: 100
          flow:
            - pattern: basic-triplet-groove
              repeat: 4
            - pattern: six-ab
              repeat: 1
            - pattern: basic-triplet-groove
              repeat: 4

        - title: Groove With A + D
          instructions: Play four repeats of the groove, then one A+D six-note phrase, then return to the groove.
          subdivision: triplet
          tempo:
            start: 60
            target: 100
          flow:
            - pattern: basic-triplet-groove
              repeat: 4
            - pattern: six-ad
              repeat: 1
            - pattern: basic-triplet-groove
              repeat: 4

        - title: Groove With F + C
          instructions: Play four repeats of the groove, then one F+C six-note phrase, then return to the groove.
          subdivision: triplet
          tempo:
            start: 60
            target: 100
          flow:
            - pattern: basic-triplet-groove
              repeat: 4
            - pattern: six-fc
              repeat: 1
            - pattern: basic-triplet-groove
              repeat: 4
      coaching_notes:
        - Keep the triplet spacing even.
        - Do not let ghost notes collapse into buzzes.
        - Treat each six-note combination as one phrase, not two disconnected triads.
        - Change drum voices without changing the sticking, spacing, or dynamic shape.
        - When applying the phrase to the groove, count through the groove and the fill.
        - The goal is smooth entry and exit, not speed.
      mastery:
        - Play each individual triad at 100 BPM with even triplet spacing.
        - Play at least four six-note combinations at 90 BPM without hesitation.
        - Apply three six-note phrases inside the groove without losing time.
